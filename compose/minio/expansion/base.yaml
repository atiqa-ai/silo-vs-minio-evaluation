name: dev908-expansion
services:
  minio1:
    image: ${MINIO_IMAGE:?Set verified immutable image digest}
    command: server http://minio{1...4}/data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set password}
    volumes:
    - minio1_data:/data
    networks:
    - dev908-expansion
    restart: 'no'
    mem_limit: 768m
    cpus: '0.75'
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${EXPANSION_S3_PORT:-9600}:9000
  minio2:
    image: ${MINIO_IMAGE:?Set verified immutable image digest}
    command: server http://minio{1...4}/data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set password}
    volumes:
    - minio2_data:/data
    networks:
    - dev908-expansion
    restart: 'no'
    mem_limit: 768m
    cpus: '0.75'
    security_opt:
    - no-new-privileges:true
  minio3:
    image: ${MINIO_IMAGE:?Set verified immutable image digest}
    command: server http://minio{1...4}/data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set password}
    volumes:
    - minio3_data:/data
    networks:
    - dev908-expansion
    restart: 'no'
    mem_limit: 768m
    cpus: '0.75'
    security_opt:
    - no-new-privileges:true
  minio4:
    image: ${MINIO_IMAGE:?Set verified immutable image digest}
    command: server http://minio{1...4}/data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set password}
    volumes:
    - minio4_data:/data
    networks:
    - dev908-expansion
    restart: 'no'
    mem_limit: 768m
    cpus: '0.75'
    security_opt:
    - no-new-privileges:true
volumes:
  minio1_data: {}
  minio2_data: {}
  minio3_data: {}
  minio4_data: {}
networks:
  dev908-expansion:
    driver: bridge
