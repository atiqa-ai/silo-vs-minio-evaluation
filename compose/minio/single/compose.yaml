name: minio-single
services:
  minio:
    image: ${MINIO_IMAGE:?Set verified immutable minio image digest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set local username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set local password}
    volumes:
    - minio_data:/data
    networks:
    - migration-net
    restart: "no"
    mem_limit: ${SINGLE_NODE_MEMORY_LIMIT:?Set Option B memory cap}
    cpus: ${SINGLE_NODE_CPUS:?Set Option B CPU cap}
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001
volumes:
  minio_data: {}
networks:
  migration-net:
    external: true
