global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: minio-single
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
  - job_name: silo-single
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["silo:9000"]
# These scrape targets require the respective stack to be active and public metrics
# configured or authenticated scraping; a DOWN target is not proof of failure.

rule_files:
  - /etc/prometheus/alerts.yml
