name: storage-proxy
services:
  proxy:
    image: ${NGINX_IMAGE:?Set verified immutable nginx image digest}
    ports:
      - '127.0.0.1:${PROXY_PORT:-19443}:443'
    volumes:
      - ../../config/proxy/${PROXY_TARGET:-minio-single}.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../local-secrets/tls:/etc/nginx/tls:ro
    networks:
      - migration-net
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
networks:
  migration-net:
    external: true
